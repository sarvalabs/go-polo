name: Lint
on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  golangci:
    name: GolangCI Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: Run Golang CI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          skip-cache: true
