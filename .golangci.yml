version: "2"

run:
  tests: true
  timeout: 5m
  issues-exit-code: 1

linters:
  default: none
  enable:
    - dogsled
    - dupl
    - errname
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nlreturn
    - nolintlint
    - predeclared
    - prealloc
    - staticcheck
    - tparallel
    - thelper
    - unconvert
    - unused
    - whitespace
    - wsl_v5

  settings:
    staticcheck:
      # v1 split these across staticcheck (SA) / gosimple (S1) / stylecheck (ST1)
      # and never ran the QF ("quickfix") group at all. v2 merged all four, so
      # QF* is net-new noise -- keep it off to match v1 coverage.
      checks:
        - all
        - -QF*
        # v1 stylecheck defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    govet:
      disable:
        # new analyzer in the Go 1.26 toolchain; pure style noise
        - inline
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: true
      branch-max-lines: 2
      # wsl_v5's cuddling rules are stricter than v1's wsl. The send and
      # err checks are net-new against v1 -- keep them off to match v1
      # coverage.
      disable:
        - send
        - err
    goconst:
      # v2's goconst also inspects struct-literal and call-argument strings
      # and counts occurrences repo-wide. Verified: v1 reported zero issues
      # in test files even with ignore-tests: false, so this loses no v1
      # coverage; without it v2 reports 125 net-new test-fixture findings.
      ignore-tests: true
    dogsled:
      max-blank-identifiers: 3
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false

  exclusions:
    # v1 default was lax; v2 default is strict
    generated: lax
    # v1 applied these implicitly; v2 does not
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - text: "Use of weak random number generator"
        linters:
          - gosec

formatters:
  enable:
    - gofumpt

issues:
  max-issues-per-linter: 10000
  max-same-issues: 10000
